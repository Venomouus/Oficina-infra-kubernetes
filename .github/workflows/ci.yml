name: CI - Kubernetes Infrastructure

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.8'
      - name: Check formatting
        run: |
          for root in infra gateway backend; do
            terraform -chdir="$root" fmt -check -recursive
          done
      - name: Initialize without remote backend
        run: |
          for root in infra gateway backend; do
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
          done
      - name: Validate configuration
        run: |
          for root in infra gateway backend; do
            terraform -chdir="$root" validate -no-color
          done
      - name: Test platform, gateways and private backends with mocked AWS provider
        run: |
          for root in infra gateway backend; do
            terraform -chdir="$root" test -no-color
          done
